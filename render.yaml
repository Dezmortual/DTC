services:
  - type: web
    name: dtc-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DTC_MODE
        value: PAPER
      - key: DTC_SYMBOL
        value: BTCUSDT
      - key: DTC_TIMEFRAME
        value: 15m
      - key: PYTHON_VERSION
        value: 3.11.9
